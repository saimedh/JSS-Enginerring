name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build production Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://jssengineering.in
          ADMIN_EMAIL: admin@jssengineering.in
          ADMIN_PASSWORD: ChangeMe123!
